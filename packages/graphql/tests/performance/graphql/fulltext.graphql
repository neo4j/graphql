query Fulltext {
    movieTaglineFulltextQuery(phrase: "the real world") {
        edges {
            node {
                title
                tagline
            }
            score
        }
    }
}

query FulltextWithNestedQuery {
    movieTaglineFulltextQuery(phrase: "the real world") {
        edges {
            node {
                title
                tagline
                actors {
                    name
                }
            }
            score
        }
    }
}

query FulltextWithSort {
    movieTaglineFulltextQuery(first: 1000, phrase: "*", sort: [{ node: { title: ASC } }]) {
        edges {
            node {
                title
                tagline
            }
        }
    }
}
