query TopLevelAggregate {
    peopleAggregate {
        count
        name {
            shortest
        }
    }
}

query TopLevelAggregateWithMultipleFields_only {
    peopleConnection {
        aggregate {
            count {
                nodes
            }
            node {
                name {
                    shortest
                }
                born {
                    max
                }
            }
        }
    }
}

query NestedAggregation_only {
    people {
        name
        moviesConnection {
            aggregate {
                node {
                    title {
                        longest
                    }
                }
            }
        }
    }
}

query TopLevelAggregateWithMultipleFieldsDeprecated_only {
    peopleAggregate {
        count
        name {
            shortest
        }
        born {
            max
        }
    }
}

query NestedAggregationDeprecated {
    people {
        name
        moviesAggregate {
            node {
                title {
                    longest
                }
            }
        }
    }
}

query AggregationWithWhere {
    people(where: { moviesAggregate: { count: 2 } }) {
        name
    }
}

query AggregationWhereWithinNestedRelationships {
    people(where: { movies_SOME: { actors_ALL: { moviesAggregate: { count_GT: 1 } } } }) {
        name
    }
}

query AggregationWhereWithinNestedConnections {
    people(
        where: {
            moviesConnection_SOME: { node: { actorsConnection_ALL: { node: { moviesAggregate: { count_GT: 1 } } } } }
        }
    ) {
        name
    }
}

query NestedCountFromMovieToActors {
    movies {
        actorsAggregate {
            count
        }
    }
}
query NestedCountFromActorsToMovie {
    people {
        moviesAggregate {
            count
        }
    }
}

query DeeplyNestedCount {
    people {
        movies {
            actors {
                moviesAggregate {
                    count
                }
            }
        }
    }
}

query InterfacesAggregations {
    movieLikesAggregate {
        title {
            longest
            shortest
        }
    }
}

query InterfacesAggregationsWithTwoFields {
    movieLikesAggregate {
        title {
            longest
            shortest
        }
        released {
            max
            min
        }
    }
}
