version: '3.5'
# This is just for local testing
services:
    rabbitmq:
        image: rabbitmq:4.0-management@sha256:f7aeae3e2779027e49ad15928e3769288b0e89bf8746019c3478beb877054277
        ports:
            - "5672:5672"
            - "15672:15672"
        environment:
            - RABBITMQ_DEFAULT_USER=guest
            - RABBITMQ_DEFAULT_PASS=guest

    qpid:
        build:
            context: ./qpid-docker
        image: qpid
        ports:
            - "5672:5672"
            - "8080:8080"
