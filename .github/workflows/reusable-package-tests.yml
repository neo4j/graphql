name: "Package tests"

on:
  workflow_call:

jobs:
  package-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Patch eMudhra CA compromise (CVE-2026-111943)
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 18.20.8
          cache: yarn
          package-manager-cache: false
      - name: Install dependencies
        run: yarn
      - name: Build graphql
        run: yarn build
        working-directory: packages/graphql
      - name: Run @neo4j/graphql package tests
        run: yarn --cwd packages/graphql run test:package-tests
