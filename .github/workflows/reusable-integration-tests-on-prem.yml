name: "Integration tests (on-prem)"

on:
  workflow_call:
    inputs:
      disable-coverage-archival:
        description: "Whether or not to archive the test coverage"
        required: false
        default: false
        type: boolean

jobs:
  integration-tests:
    strategy:
      matrix:
        packages:
          [
            { package: "introspector", shard: 1/1, coverage_name: 2 },
            { package: "graphql", shard: 1/4, coverage_name: 3 },
            { package: "graphql", shard: 2/4, coverage_name: 4 },
            { package: "graphql", shard: 3/4, coverage_name: 5 },
            { package: "graphql", shard: 4/4, coverage_name: 6 },
          ]
        version:
          [
            { neo4j: "5-enterprise", graphql: "^15.0.0", coverage_path: 15 },
            { neo4j: "5-enterprise", graphql: "^16.0.0", coverage_path: 16 },
            { neo4j: "2025-enterprise", graphql: "^16.0.0", coverage_path: 16 },
          ]

    runs-on: ubuntu-latest

    services:
      neo4j:
        image: neo4j:${{ matrix.version.neo4j }}
        env:
          NEO4J_AUTH: neo4j/password
          NEO4J_PLUGINS: '["apoc"]'
          NEO4J_ACCEPT_LICENSE_AGREEMENT: yes
        ports:
          - 7687:7687

    steps:
      - name: Check out repository code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        with:
          node-version: 24
          cache: yarn
          package-manager-cache: false
      - name: Install dependencies
        run: yarn --immutable
      - name: Overwrite GraphQL version
        run: yarn up --exact graphql@${{ matrix.version.graphql }}
      - name: Run @neo4j/graphql integration tests and move coverage
        run: |
          yarn test:int --shard=${{ matrix.packages.shard }} --coverage
          mv coverage coverage-${{ matrix.version.neo4j }}-${{ matrix.version.coverage_path }}
        working-directory: packages/${{ matrix.packages.package }}
        env:
          NEO_USER: neo4j
          NEO_PASSWORD: password
          NEO_URL: bolt://localhost:7687
          USE_RESTRICTED_USER: true
      - if: ${{ !inputs.disable-coverage-archival && matrix.packages.package == 'graphql' }}
        name: Archive coverage report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: integration-coverage-${{ matrix.packages.package }}-${{ matrix.version.neo4j }}-${{ matrix.version.coverage_path }}-${{ matrix.packages.coverage_name }}
          path: packages/${{ matrix.packages.package }}/coverage-${{ matrix.version.neo4j }}-${{ matrix.version.coverage_path }}/

  merge-integration-tests-results:
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - if: ${{ !inputs.disable-coverage-archival }}
        name: Merge Artifacts
        uses: actions/upload-artifact/merge@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: integration-coverage
          pattern: integration-coverage-*
